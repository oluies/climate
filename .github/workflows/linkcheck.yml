name: Link check (warning only)
on:
  push:
    branches: ["main"]
    paths:
      - "without-hot-air/src/chap-value-of-renewables.md"
      - "book/index.qmd"
      - ".github/workflows/linkcheck.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  # Separate from the build; never blocks the deploy. Scoped to the revised
  # content and the front matter, both of which carry live external citations.
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links (non-blocking)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 2 --accept 200,429
            book/index.qmd without-hot-air/src/chap-value-of-renewables.md
            without-hot-air/src/author.md without-hot-air/src/acknowledgments.md
            without-hot-air/src/chap06.md without-hot-air/src/chapM.md without-hot-air/src/chapN.md
          fail: false
