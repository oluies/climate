name: Build and deploy the book
on:
  push:
    branches: ["main"]
    paths:
      - "without-hot-air/**"
      - "book/**"
      - ".github/workflows/book.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Shared with main.yml: both publish to gh-pages and a concurrent
  # push would fail non-fast-forward and lose a deploy silently.
  group: gh-pages-deploy
  # Queue, do not cancel: these two workflows deploy different content to the
  # same branch (book to root, site to site/), so cancelling one to run the
  # other silently drops a deploy - which is what happened to #101.
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # uv reads the PEP 723 header in prep_book.py and fetches the interpreter
      # it asks for, so the Python version lives in the script rather than here.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Prepare chapters (rewrite image paths, strip third-party figures)
        run: uv run book/scripts/prep_book.py
      - name: Render
        run: quarto render book
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/_book
          publish_branch: gh-pages
          # The book owns the root. keep_files stops this publish from deleting
          # /site, which main.yml maintains in the same branch.
          keep_files: true
